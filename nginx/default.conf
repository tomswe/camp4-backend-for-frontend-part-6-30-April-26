server {
    # Nginx akan mendengarkan semua lalu lintas masuk yang lewat port 80 (HTTP standar).
    listen 80;

    # Ganti dengan domain asli Anda saat sudah live di production, contoh: api.domainkamu.com
    # Untuk sementara di lokal atau jika belum ada domain, bisa diisi '_' (artinya menerima semua IP/domain).
    server_name _;

    # Blok ini mengatur apa yang terjadi jika ada request masuk ke URL utama '/' (misal: http://alamat-ip/)
    location / {
        
        # ---------------------------------------------------------------------
        # TERUSKAN REQUEST KE BACKEND EXPRESS
        # ---------------------------------------------------------------------
        # 'http://api:3000' -> 'api' adalah nama service yang kita buat di docker-compose.yml.
        # Docker memiliki DNS internal, jadi kita tidak perlu menulis IP manual. 
        # Nginx otomatis tahu bahwa 'api' merujuk ke container Express kita di port 3000.
        proxy_pass http://api:3000;

        # ---------------------------------------------------------------------
        # PENGATURAN PROTOKOL & KONEKSI
        # ---------------------------------------------------------------------
        # Menggunakan HTTP versi 1.1 yang mendukung koneksi persisten (keep-alive) 
        # dan sangat disarankan untuk fitur modern seperti WebSockets.
        proxy_http_version 1.1;
        
        # Dua baris di bawah ini penting jika aplikasi Anda nantinya menggunakan WebSocket (misal socket.io).
        # Ini memungkinkan koneksi HTTP biasa ditingkatkan (Upgrade) menjadi koneksi WebSocket yang interaktif.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # ---------------------------------------------------------------------
        # MENERUSKAN INFORMASI ASLI DARI CLIENT (PENTING!)
        # ---------------------------------------------------------------------
        # Tanpa baris-baris ini, Express backend Anda akan mengira SEMUA request berasal dari Nginx (localhost).
        
        # Mengirimkan nama host/domain asli yang diketik oleh pengguna di browser.
        proxy_set_header Host $host;
        
        # Mengirimkan IP Address asli milik pengguna (sangat berguna untuk fitur logging, keamanan, atau deteksi lokasi).
        proxy_set_header X-Real-IP $remote_addr;
        
        # Menjaga daftar IP jika request melewati beberapa proxy sebelum sampai ke server Anda.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Memberitahu backend apakah pengguna menggunakan HTTP atau HTTPS.
        # Ini SANGAT KRUSIAL jika backend Anda menggunakan cookie dengan atribut 'secure: true'.
        # Jika baris ini hilang, Express tidak akan tahu kalau web sudah pakai HTTPS, dan cookie tidak akan terkirim.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mengabaikan cache bawaan nginx agar data yang dikirim backend selalu yang paling terbaru (real-time).
        proxy_cache_bypass $http_upgrade;
    }
}